# FrontDesk's Slack app: paste this at https://api.slack.com/apps -> Create New App ->
# From a manifest, pick your workspace, then Install to Workspace and copy the User OAuth Token.
# It asks only for user-token scopes (no bot): FrontDesk reads as you and posts only when you
# confirm a Send. Each scope is here for one call in frontdesk/slack/client.py:
#   *:read     conversations.list / conversations.info (your channels, private channels, DMs, group DMs)
#   *:history  conversations.history / conversations.replies (their messages and threads)
#   users:read users.info (display names)
#   chat:write chat.postMessage (a reply you confirmed)
#   search:read search.messages (the search box)
#   im:write, mpim:write  conversations.mark (marking a DM or group DM read)
display_information:
  name: FrontDesk
  description: Your own copy of FrontDesk reads your Slack for your local inbox.
oauth_config:
  scopes:
    user:
      - channels:read
      - groups:read
      - im:read
      - mpim:read
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - users:read
      - chat:write
      - search:read
      - im:write
      - mpim:write
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
