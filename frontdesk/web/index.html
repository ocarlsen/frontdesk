<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>FrontDesk</title>
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<svg class="icons" aria-hidden="true" width="0" height="0" focusable="false">
  <symbol id="i-archive" viewBox="0 0 24 24"><path d="M4 7h16v13H4zM3 3h18v4H3zM9.5 11h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></symbol>
  <symbol id="i-unread" viewBox="0 0 24 24"><path d="M3.5 6h17v12h-17zM3.5 6.5l8.5 6.5 8.5-6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-read" viewBox="0 0 24 24"><path d="M3.5 10l8.5-6 8.5 6v9.5h-17zM3.5 10l8.5 6 8.5-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="i-clear" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
</svg>
<header class="top">
  <h1>FrontDesk</h1>
  <ul id="counts" class="counts" aria-label="Counts per bucket"></ul>
  <div class="syncbar">
    <span id="syncnote" class="syncnote" role="status"></span>
    <span class="kbdhint">Press ? for shortcuts</span>
    <button id="memory" class="btn" type="button">Memory</button>
    <button id="profile" class="btn" type="button">Profile</button>
    <button id="sync" class="btn" type="button">Sync</button>
  </div>
  <input id="search" class="search" type="search" placeholder="Search (/): type to filter FrontDesk, Enter searches Gmail and Slack"
         aria-label="Search" autocomplete="off" spellcheck="false" maxlength="500">
</header>
<div id="selbar" class="selbar" role="toolbar" aria-label="Selected threads" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="help" class="help" role="dialog" aria-label="Keyboard shortcuts" hidden></div>
<div id="profilepanel" class="help" role="dialog" aria-label="Your profile" hidden></div>
<main id="main">
  <p id="status" class="status">Loading</p>
</main>
</body>
</html>
